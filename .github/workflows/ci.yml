name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.2.1"

      - name: Run tests
        run: make test

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find include tests examples \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.2.1"

      - name: Install clang tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang clang-tidy

      - name: Configure
        run: |
          cmake -B build \
            -DQUIKCLI_BUILD_TESTS=ON \
            -DQUIKCLI_BUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Run clang-tidy
        run: |
          find tests examples -name '*.cpp' \
            | xargs clang-tidy -p build
